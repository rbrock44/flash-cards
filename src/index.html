<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flash Cards - Study Flashcards App</title>
  <meta name="description" content="A study flashcard app with categories and subcategories for quizzing yourself, showing questions and answers you can flip through and reveal.">
  <link rel="canonical" href="https://flash-cards.ryan-brock.com/">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Flash Cards - Study Flashcards App">

  <meta property="og:type" content="website">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a1c">
  <script>
    (function () {
      try {
        var stored = window.localStorage.getItem('flash-cards-theme');
        document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
